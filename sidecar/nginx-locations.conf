  # Native x-ui path-scoped cookie bootstrap. The Python backend checks
  # the current webBasePath on each request, so arbitrary paths cannot bypass it.
  # MASIHA-NATIVE-AUTH-ROUTES BEGIN
  location = /xui/panel/sales-bot { return 302 "/masiha-ui/#bot"; }
  location = /xui/panel/sales-bot/ { return 302 "/masiha-ui/#bot"; }
  location ~ "^/(?:[A-Za-z0-9._~-]+/){1,6}panel/sales-bot/?$" {
    return 302 "/masiha-ui/#bot";
  }
  location ~ "^/(?:[A-Za-z0-9._~-]+/){1,6}panel/api/(?:masiha-session|masiha-vpn|sales-bot|masiha-backup/(?:status|create|import|restore|download/.+))$" {
    client_max_body_size 512m;
    proxy_pass http://127.0.0.1:61794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering on;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }
  # MASIHA-NATIVE-AUTH-ROUTES END
  # MASIHA-SIDECAR BEGIN
  location = /masiha-ui { return 301 /masiha-ui/; }
  location ^~ /masiha-ui/ {
    alias /var/www/masiha-ui/;
    index masiha-standalone.html;
    add_header Cache-Control "private, no-store";
    add_header X-Content-Type-Options nosniff;
  }
  # Stable authenticated session bridge; never exposes the secret panel
  # path until after native x-ui session validation succeeds.
  location = /masiha-ui/api/session {
    proxy_pass http://127.0.0.1:61794;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 12s;
  }
  location = /xui/sales-payment {
    proxy_pass http://127.0.0.1:61794;
    proxy_set_header Host $host;
    proxy_read_timeout 45s;
  }
  location = /xui/panel/api/masiha-vpn {
    proxy_pass http://127.0.0.1:61794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location = /xui/panel/api/sales-bot {
    proxy_pass http://127.0.0.1:61794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location ^~ /xui/panel/api/masiha-backup/ {
    client_max_body_size 512m;
    proxy_pass http://127.0.0.1:61794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering on;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }
  # MASIHA-SIDECAR END
