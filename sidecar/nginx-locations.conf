  # MASIHA-SIDECAR BEGIN
  location = /masiha-ui { return 301 /masiha-ui/; }
  location ^~ /masiha-ui/ {
    alias /var/www/masiha-ui/;
    index masiha-standalone.html;
    add_header Cache-Control "private, no-store";
    add_header X-Content-Type-Options nosniff;
  }
  location = /xui/sales-payment {
    proxy_pass http://127.0.0.1:61794;
    proxy_set_header Host $host;
    proxy_read_timeout 45s;
  }
  location = /xui/panel/api/masiha-vpn {
    proxy_pass http://127.0.0.1:61794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location = /xui/panel/api/sales-bot {
    proxy_pass http://127.0.0.1:61794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location ^~ /xui/panel/api/masiha-backup/ {
    client_max_body_size 512m;
    proxy_pass http://127.0.0.1:61794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering on;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }
  # MASIHA-SIDECAR END
