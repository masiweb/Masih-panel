<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | Masiha VPN</title><link rel="stylesheet" href="/static/admin.css"></head>
<body class="auth-page"><main class="login-card"><div class="brand">M</div><h1>Masiha VPN Platform</h1><p>ورود به پنل مدیریت مرکزی</p><form id="login"><label>نام کاربری<input id="username" autocomplete="username" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button>ورود امن</button><div id="error"></div></form></main>
<script>document.getElementById('login').onsubmit=async(e)=>{e.preventDefault();let r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location='/admin';else error.textContent=(await r.json()).detail||'خطا در ورود'};</script></body></html>
