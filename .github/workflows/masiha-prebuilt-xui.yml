name: Build and publish precompiled Masiha x-ui for fast VPS updates

on:
  push:
    branches:
      - upgrade/3x-ui-v3.11.0-migration
    paths:
      - .github/workflows/masiha-prebuilt-xui.yml
      - deploy/3x-ui.patch
      - deploy/build-3x-ui.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masiha-prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Masiha source
        uses: actions/checkout@v4

      - name: Set up pinned Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Restore shared Go object and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: masiha-go-${{ runner.os }}-${{ hashFiles('deploy/3x-ui.patch') }}
          restore-keys: |
            masiha-go-${{ runner.os }}-

      - name: Compile pinned, patched 3x-ui on GitHub infrastructure
        env:
          MASIHA_BUILD_ROOT: ${{ github.workspace }}/.masiha-prebuilt-work
          MASIHA_GOPROXY: https://proxy.golang.org
        run: |
          set -Eeuo pipefail
          bash deploy/build-3x-ui.sh
          test -x "$MASIHA_BUILD_ROOT/x-ui"
          test -s "$MASIHA_BUILD_ROOT/source-patch.sha256"
          "$MASIHA_BUILD_ROOT/x-ui" -v | grep -F 3.11.0

      - name: Package binary and immutable hash metadata
        id: archive
        env:
          BUILD_ROOT: ${{ github.workspace }}/.masiha-prebuilt-work
        run: |
          set -Eeuo pipefail
          PATCH_SHA="$(sha256sum deploy/3x-ui.patch | awk '{print $1}')"
          TAG="masiha-xui-$PATCH_SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          tar -C "$BUILD_ROOT" -czf "$RUNNER_TEMP/x-ui-linux-amd64.tar.gz" x-ui
          (
            cd "$RUNNER_TEMP"
            sha256sum x-ui-linux-amd64.tar.gz > x-ui-linux-amd64.tar.gz.sha256
          )
          printf '%s %s\n' 'c621ba9014a6aa21fd7c9ecf45655e44e24ebf13' "$PATCH_SHA" \
            > "$RUNNER_TEMP/build-id.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c x-ui-linux-amd64.tar.gz.sha256)

      - name: Publish publicly downloadable prebuilt x-ui
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.archive.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists for this exact Masiha patch.'
            # A partial release can happen if a previous workflow was interrupted.
            gh release upload "$TAG" \
              "$RUNNER_TEMP/x-ui-linux-amd64.tar.gz" \
              "$RUNNER_TEMP/x-ui-linux-amd64.tar.gz.sha256" \
              "$RUNNER_TEMP/build-id.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/x-ui-linux-amd64.tar.gz" \
              "$RUNNER_TEMP/x-ui-linux-amd64.tar.gz.sha256" \
              "$RUNNER_TEMP/build-id.txt" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Masiha x-ui 3.11.0 ($TAG)" \
              --notes 'Verified amd64 3x-ui build for the pinned Masiha native patch. Used by the backup-independent one-command updater.'
          fi
          echo "PUBLISHED_RELEASE=$TAG"
